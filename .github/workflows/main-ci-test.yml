name: Main CI Test Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  auth-service-ci:
    name: Auth Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/authService

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Node.js ortamının hazırlanması
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/authService/package-lock.json

      - name: Bağımlılıkların hazırlanması
        run: npm ci

      - name: Unit ve integration testlerinin çalıştırılması
        run: npm test

  management-service-ci:
    name: Management Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/managementService

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Node.js ortamının hazırlanması
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/managementService/package-lock.json

      - name: Bağımlılıkların hazırlanması
        run: npm ci

      - name: Unit ve integration testlerinin çalıştırılması
        run: npm test

  socket-service-ci:
    name: Socket Service CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/socketService

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Node.js ortamının hazırlanması
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/socketService/package-lock.json

      - name: Bağımlılıkların hazırlanması
        run: npm ci

      - name: Unit ve integration testlerinin çalıştırılması
        run: npm test

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Node.js ortamının hazırlanması
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Bağımlılıkların hazırlanması
        run: npm ci

      - name: Unit testlerinin çalıştırılması
        run: npm test

      - name: Frontend build sürecinin çalıştırılması
        run: npm run build

  docker-image-build-ci:
    name: Docker Image Build CI
    runs-on: ubuntu-latest
    needs:
      - auth-service-ci
      - management-service-ci
      - socket-service-ci
      - frontend-ci

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: CI ortam değişkenlerinin hazırlanması
        run: |
          cp .env.example .env

      - name: Docker image build adımlarının çalıştırılması
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Docker image artifact'ının hazırlanması
        run: |
          docker save \
            lms-client:ci \
            lms-auth-service:ci \
            lms-management-service:ci \
            lms-socket-service:ci \
            | gzip > docker-images.tar.gz

      - name: Docker image artifact'ının yüklenmesi
        uses: actions/upload-artifact@v4
        with:
          name: lms-docker-images
          path: docker-images.tar.gz
          retention-days: 1
          compression-level: 0

  selenium-ui-ci:
    name: Selenium UI CI
    runs-on: ubuntu-latest
    needs:
      - docker-image-build-ci

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Java ortamının hazırlanması
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: CI ortam değişkenlerinin hazırlanması
        run: |
          cp .env.example .env

      - name: Docker image artifact'ının indirilmesi
        uses: actions/download-artifact@v4
        with:
          name: lms-docker-images

      - name: Docker image'larının yüklenmesi
        run: docker load -i docker-images.tar.gz

      - name: Uygulama ve veritabanlarının ayağa kaldırılması
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build

      - name: Uygulamanın hazır olmasının beklenmesi
        run: |
          timeout 120 bash -c 'until curl -fsS http://localhost:5173 >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:1001/api/auth/bootstrap/status >/dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -fsS http://localhost:1003/health >/dev/null; do sleep 2; done'

      - name: Selenium lifecycle testinin çalıştırılması
        working-directory: TestAutomation
        run: xvfb-run -a mvn -q -Dtest=tests.PositiveRoleBasedLeaveLifecycleTest test

      - name: Selenium demo data testinin çalıştırılması
        working-directory: TestAutomation
        run: xvfb-run -a mvn -q -Dtest=tests.PositiveDemoDataSetupTest test

      - name: Selenium page tour testinin çalıştırılması
        working-directory: TestAutomation
        run: xvfb-run -a mvn -q -Dtest=tests.PositiveRoleBasedPageTourTest test

      - name: Docker loglarının yüklenmesi
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color > docker-compose-logs.txt

      - name: Hata loglarının artifact olarak yüklenmesi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-ui-failure-logs
          path: |
            docker-compose-logs.txt
            TestAutomation/target/surefire-reports/
            TestAutomation/target/allure-results/

      - name: Uygulama ortamının kapatılması
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v

  kubernetes-deploy-ci:
    name: Kubernetes Deploy CI
    runs-on: self-hosted
    needs:
      - selenium-ui-ci

    steps:
      - name: Repository'den kodun alınması
        uses: actions/checkout@v4

      - name: Docker image artifact'ının indirilmesi
        uses: actions/download-artifact@v4
        with:
          name: lms-docker-images

      - name: Docker image'larının yüklenmesi
        run: docker load -i docker-images.tar.gz

      - name: Docker Desktop Kubernetes context'inin seçilmesi
        run: |
          kubectl config use-context docker-desktop
          kubectl cluster-info
          kubectl get nodes

      - name: Kubernetes manifestlerinin uygulanması
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configs/
          kubectl apply -f k8s/databases/
          kubectl rollout status statefulset/postgres -n leave-management --timeout=180s
          kubectl rollout status statefulset/mongodb -n leave-management --timeout=180s
          kubectl delete job management-migration -n leave-management --ignore-not-found
          kubectl apply -f k8s/backend/management-migration-job.yml
          kubectl wait --for=condition=complete job/management-migration -n leave-management --timeout=180s
          kubectl apply -f k8s/backend/auth-deployment.yml
          kubectl apply -f k8s/backend/management-deployment.yml
          kubectl apply -f k8s/backend/socket-deployment.yml
          kubectl apply -f k8s/client/
          kubectl rollout restart deployment/auth-service -n leave-management
          kubectl rollout restart deployment/management-service -n leave-management
          kubectl rollout restart deployment/socket-service -n leave-management
          kubectl rollout restart deployment/client -n leave-management

      - name: Kubernetes deployment durumlarının beklenmesi
        run: |
          kubectl rollout status deployment/auth-service -n leave-management --timeout=180s
          kubectl rollout status deployment/management-service -n leave-management --timeout=180s
          kubectl rollout status deployment/socket-service -n leave-management --timeout=180s
          kubectl rollout status deployment/client -n leave-management --timeout=180s

      - name: Kubernetes servis smoke testlerinin çalıştırılması
        timeout-minutes: 3
        run: |
          until curl -fsS http://localhost:30080 >/dev/null; do sleep 2; done
          until curl -fsS http://localhost:31001/api/auth/bootstrap/status >/dev/null; do sleep 2; done
          until curl -fsS http://localhost:31003/health >/dev/null; do sleep 2; done

      - name: Kubernetes hata tanılarının hazırlanması
        if: failure()
        run: |
          mkdir -p k8s-diagnostics
          kubectl get all,pvc -n leave-management -o wide > k8s-diagnostics/resources.txt || true
          kubectl describe pods -n leave-management > k8s-diagnostics/pods.txt || true
          kubectl get events -n leave-management --sort-by=.lastTimestamp > k8s-diagnostics/events.txt || true
          kubectl logs -n leave-management job/management-migration --all-containers=true > k8s-diagnostics/management-migration.log || true
          kubectl logs -n leave-management -l app=auth-service --all-containers=true --tail=-1 > k8s-diagnostics/auth-service.log || true
          kubectl logs -n leave-management -l app=management-service --all-containers=true --tail=-1 > k8s-diagnostics/management-service.log || true
          kubectl logs -n leave-management -l app=socket-service --all-containers=true --tail=-1 > k8s-diagnostics/socket-service.log || true
          kubectl logs -n leave-management -l app=client --all-containers=true --tail=-1 > k8s-diagnostics/client.log || true

      - name: Kubernetes hata artifact'larının yüklenmesi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-deploy-failure-logs
          path: k8s-diagnostics/
