apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: leave-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: lms-client:ci
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: app-configmap
---
apiVersion: v1
kind: Service
metadata:
  name: client
  namespace: leave-management
spec:
  type: NodePort
  selector:
    app: client
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
