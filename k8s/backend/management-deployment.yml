apiVersion: apps/v1
kind: Deployment
metadata:
  name: management-service
  namespace: leave-management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: management-service
  template:
    metadata:
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: management-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15-alpine
          command:
            - sh
            - -c
          args:
            - until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          envFrom:
            - configMapRef:
                name: app-configmap
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
      containers:
        - name: management-service
          image: lms-management-service:ci
          imagePullPolicy: Never
          ports:
            - containerPort: 1002
          envFrom:
            - configMapRef:
                name: app-configmap
            - secretRef:
                name: app-secret
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: management-service
  namespace: leave-management
spec:
  selector:
    app: management-service
  ports:
    - port: 1002
      targetPort: 1002
