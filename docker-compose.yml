services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: client
    ports:
      - "5173:80"
    env_file:
      - .env
    depends_on:
      - auth_service
      - management_service
      - socket_service

  auth_service:
    build:
      context: ./backend/authService
      dockerfile: Dockerfile
    container_name: auth_service
    env_file:
      - .env
    depends_on:
      - mongodb

  management_service:
    build:
      context: ./backend/managementService
      dockerfile: Dockerfile
    container_name: management_service
    command: sh -c "npx sequelize-cli db:migrate && npm start"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      socket_service:
        condition: service_started

  socket_service:
    build:
      context: ./backend/socketService
      dockerfile: Dockerfile
    container_name: socket_service
    env_file:
      - .env
    depends_on:
      - auth_service

  mongodb:
    image: mongo:latest
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
  postgres_data:
